<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fff6e7">
  <title>とけいであそぼう</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./style.css">
  <script src="./game.js" defer></script>
</head>
<body>
  <main class="game">
    <h1>とけいであそぼう</h1>
    <section class="play" aria-labelledby="prompt">
      <div class="clock-wrap">
        <svg id="clock" class="clock" viewBox="0 0 360 360" role="img" aria-labelledby="clock-description">
          <title id="clock-description">とけい。みじかい はりは 3、ながい はりは 12。</title>
          <circle cx="180" cy="184" r="171" fill="#67aca1"/>
          <circle cx="180" cy="177" r="171" fill="#a9e1d0"/>
          <circle cx="180" cy="177" r="151" fill="#5ca594"/>
          <circle cx="180" cy="180" r="149" fill="#fffcf4"/>
          <g class="ticks" aria-hidden="true">
            <path d="M180 40v8m0 264v8M40 180h8m264 0h8"/>
            <path d="M180 40v7m0 266v7M40 180h7m266 0h7" transform="rotate(30 180 180)"/>
            <path d="M180 40v7m0 266v7M40 180h7m266 0h7" transform="rotate(60 180 180)"/>
          </g>
          <g class="numbers" aria-hidden="true">
            <text x="180" y="68">12</text>
            <text x="236" y="83">1</text>
            <text x="277" y="124">2</text>
            <text x="292" y="180">3</text>
            <text x="277" y="236">4</text>
            <text x="236" y="277">5</text>
            <text x="180" y="292">6</text>
            <text x="124" y="277">7</text>
            <text x="83" y="236">8</text>
            <text x="68" y="180">9</text>
            <text x="83" y="124">10</text>
            <text x="124" y="83">11</text>
          </g>
          <g id="minute-hand" class="minute-hand" transform="rotate(0 180 180)" aria-hidden="true">
            <path d="M180 195V90"/>
            <circle class="grip" cx="180" cy="90" r="2.8"/>
          </g>
          <g id="hour-hand" class="hour-hand" transform="rotate(90 180 180)" aria-hidden="true">
            <path d="M180 190V120"/>
            <circle class="grip" cx="180" cy="120" r="3.5"/>
          </g>
          <circle cx="180" cy="180" r="7" fill="#263f42" aria-hidden="true"/>
          <circle cx="178.5" cy="178" r="2" fill="#fffcf4" aria-hidden="true"/>
        </svg>
      </div>

      <div class="challenge">
        <svg class="mascot" viewBox="0 0 150 100" aria-hidden="true">
          <ellipse cx="75" cy="92" rx="36" ry="4" fill="#efdfbf"/>
          <g class="bird">
            <path d="M66 83v6m17-6v6m-17-1-5 2m22-2 5 2" fill="none" stroke="#a75537" stroke-width="3" stroke-linecap="round"/>
            <path d="M45 60c-9-4-12-13-8-15 5-2 10 7 16 7" fill="#e8a233"/>
            <path d="M73 24c-2-7-1-12 3-13 5-1 5 6 3 10 4-6 9-7 10-4 2 4-3 8-8 10" fill="#efad37"/>
            <path d="M46 56c0-19 13-33 30-33 19 0 31 14 31 32 0 22-15 31-32 31-18 0-29-12-29-30Z" fill="#ffd269"/>
            <path d="M46 58c4 12 15 19 30 19 14 0 25-6 30-16-3 18-17 25-31 25-17 0-27-10-29-28Z" fill="#f1b244"/>
            <path d="M54 60c3-3 12 1 14 6-3 4-11 2-14-3Z" fill="#df9335"/>
            <path d="M105 53l11 5-11 5Z" fill="#b96639"/>
            <ellipse cx="84" cy="62" rx="6" ry="3.8" fill="#ed9861"/>
            <circle class="bird-eye" cx="93" cy="48" r="3.5" fill="#263f42"/>
            <path class="bird-smile" d="M88 49q5-7 10 0" fill="none" stroke="#263f42" stroke-width="2.8" stroke-linecap="round"/>
            <path d="M61 72q13 7 30 0l-5 12q-14 1-25-6Z" fill="#31897e"/>
          </g>
          <g class="sparkles" fill="#da834b">
            <path d="M22 24q0 10 10 10-10 0-10 10 0-10-10-10 10 0 10-10Z"/>
            <path d="M124 16q0 9 9 9-9 0-9 9 0-9-9-9 9 0 9-9Z"/>
            <circle cx="137" cy="47" r="2.8"/>
          </g>
        </svg>
        <div class="prompt-row">
          <h2 id="prompt" aria-live="polite">いま なんじ？</h2>
          <button id="speak" class="sound-button" type="button" aria-label="もんだいを きく">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4zM16 9a4 4 0 0 1 0 6m2-8a7 7 0 0 1 0 10"/></svg>
          </button>
        </div>
        <div class="actions">
          <div id="choices" class="choices" role="group" aria-label="じかんを えらぶ">
            <button class="answer" type="button" value="120">2じ</button>
            <button class="answer" type="button" value="180">3じ</button>
            <button class="answer" type="button" value="240">4じ</button>
          </div>
          <div id="adjustments" class="adjustments" role="group" aria-label="はりを うごかす" aria-describedby="keyboard-help" hidden>
            <span id="keyboard-help" class="sr-only">みぎ・うえの キーで すすむ。ひだり・したの キーで もどる。</span>
            <button id="hour-action" class="hand-button short" type="button" aria-label="みじかい はりを すすめる">
              <svg viewBox="0 0 28 28" aria-hidden="true"><path class="hand-icon" d="M14 14v-5"/><path d="M19 5a10 10 0 1 1-10 0M5 2v7h7"/></svg>
              みじかい
            </button>
            <button id="minute-action" class="hand-button long" type="button" aria-label="ながい はりを すすめる" hidden>
              <svg viewBox="0 0 28 28" aria-hidden="true"><path class="hand-icon" d="M14 15V5"/><path d="M19 5a10 10 0 1 1-10 0M5 2v7h7"/></svg>
              ながい
            </button>
          </div>
          <button id="next" class="next" type="button" hidden>
            つぎへ <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12h15m-6-6 6 6-6 6"/></svg>
          </button>
        </div>
        <p id="feedback" class="feedback" role="status" aria-atomic="true"><span id="feedback-text"></span><span id="feedback-detail" class="sr-only"></span></p>
      </div>
    </section>

    <div class="practice">
      <div class="switch" role="group" aria-label="あそびかた">
        <button id="read-mode" type="button" aria-pressed="true">よむ</button>
        <button id="set-mode" type="button" aria-pressed="false">あわせる</button>
      </div>
      <div id="lessons" class="switch" role="group" aria-label="れんしゅう" hidden>
        <button id="whole-hours" type="button" aria-label="○じの れんしゅう" aria-pressed="true">○じ</button>
        <button id="half-hours" type="button" aria-label="○じはんの れんしゅう" aria-pressed="false">○じはん</button>
      </div>
    </div>
  </main>
</body>
</html>
