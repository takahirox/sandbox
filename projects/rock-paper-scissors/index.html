<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Online rock paper scissors · Sandbox</title>
  <link rel="stylesheet" href="./style.css">
  <script type="module" src="./game.js"></script>
</head>
<body>
  <main>
    <section id="lobby" aria-labelledby="lobby-title">
      <a class="back" href="../../">← Sandbox</a>
      <header class="lobby-heading">
        <p class="eyebrow" lang="ja">じゃんけん</p>
        <h1 id="lobby-title">Rock. Paper. Scissors.</h1>
        <p>Choose a room.</p>
      </header>
      <div id="rooms" class="rooms" aria-label="Rooms"></div>
      <p id="lobby-update" class="sr-only" role="status" aria-atomic="true"></p>
    </section>
    <section id="game" aria-labelledby="room-title" hidden>
      <div class="room-header">
        <button id="leave" class="back">← Room list</button>
        <h2 id="room-title"></h2>
      </div>
      <p id="role" class="sr-only"></p>
      <p id="spectator-label" class="eyebrow" hidden>Watching</p>
      <div id="score" class="score" aria-label="Match score" aria-live="polite" aria-atomic="true"></div>
      <div class="match-status">
        <p id="phase" role="status" aria-atomic="true"></p>
        <p id="round">First to 3</p>
      </div>
      <p id="submission" class="sr-only" role="status" aria-atomic="true"></p>
      <div id="result" class="result" role="status" aria-atomic="true"></div>
      <div id="hands" class="hands" role="group" aria-label="Choose your hand">
        <button data-hand="rock" aria-label="Rock"><span class="hand-symbol" aria-hidden="true">✊</span><span>Rock</span></button>
        <button data-hand="scissors" aria-label="Scissors"><span class="hand-symbol" aria-hidden="true">✌️</span><span>Scissors</span></button>
        <button data-hand="paper" aria-label="Paper"><span class="hand-symbol" aria-hidden="true">✋</span><span>Paper</span></button>
      </div>
      <button id="rematch" hidden>Play again</button>
      <p id="consent" role="status" aria-atomic="true"></p>
    </section>
    <p id="connection" role="status">Connecting…</p>
    <p id="notice" role="status" aria-atomic="true"></p>
    <p id="availability" role="status"></p>
    <dialog id="room-choice" aria-labelledby="choice-title" aria-describedby="choice-state">
      <h2 id="choice-title"></h2>
      <p id="choice-state" role="status"></p>
      <div class="choice-actions">
        <button id="play">Play</button>
        <button id="watch" class="quiet">Watch</button>
      </div>
      <form method="dialog"><button class="back">Cancel</button></form>
    </dialog>
  </main>
</body>
</html>
