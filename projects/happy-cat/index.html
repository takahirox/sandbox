<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Happy cat</title>
  <link rel="preload" href="./cat-happy.svg" as="image" type="image/svg+xml">
  <style>
    body {
      margin: 0;
      padding: 2rem 1rem;
      background: #fff8ed;
      color: #49372c;
      font-family: system-ui, sans-serif;
      line-height: 1.6;
      text-align: center;
    }

    main { max-width: 28rem; margin: auto; }
    h1 { margin-bottom: .25rem; }

    button {
      display: block;
      width: min(100%, 22rem);
      margin: 1.5rem auto;
      padding: 0;
      border: 0;
      border-radius: 1rem;
      background: transparent;
      cursor: pointer;
      touch-action: manipulation;
    }

    button:focus-visible { outline: 3px solid #875329; outline-offset: 4px; }
    img { display: block; width: 100%; height: auto; }
    a { color: #714520; }
  </style>
</head>
<body>
  <main>
    <h1>Happy cat</h1>
    <p>Click or tap the cat to change its mood.</p>
    <button type="button" id="cat-button" aria-label="Make the cat happy" aria-pressed="false">
      <img id="cat" src="./cat-normal.svg" alt="An orange cat with open eyes and a calm expression." width="360" height="320">
    </button>
    <p id="mood" role="status">A quiet little cat.</p>
    <noscript><p>Enable JavaScript to change the cat's mood.</p></noscript>
    <p><a href="../../">Back to the playground</a></p>
  </main>
  <script>
    const button = document.getElementById('cat-button');
    const cat = document.getElementById('cat');
    const mood = document.getElementById('mood');

    // Keep playback and stopping here so a local audio file can replace speech later.
    function playHappyCatAudio(happy) {
      try {
        const synthesis = window.speechSynthesis;
        if (!synthesis) return;

        synthesis.cancel();
        if (!happy || typeof window.SpeechSynthesisUtterance !== 'function') return;

        const utterance = new window.SpeechSynthesisUtterance('がんばったにゃー');
        utterance.lang = 'ja-JP';
        utterance.pitch = 1.25;
        utterance.rate = 1;
        // Voices may load after the page; check the current list on every activation.
        const voices = synthesis.getVoices();
        const voice = voices.find((voice) => voice.lang.toLowerCase() === 'ja-jp')
          || voices.find((voice) => /^ja(?:-|$)/i.test(voice.lang));
        if (voice) utterance.voice = voice;
        synthesis.speak(utterance);
      } catch {
        // Audio is optional when browser speech is unavailable or fails.
      }
    }

    button.addEventListener('click', () => {
      const happy = button.getAttribute('aria-pressed') !== 'true';
      button.setAttribute('aria-pressed', String(happy));
      cat.src = happy ? './cat-happy.svg' : './cat-normal.svg';
      cat.alt = happy
        ? 'The same orange cat smiling with happily closed eyes and rosy cheeks.'
        : 'An orange cat with open eyes and a calm expression.';
      mood.textContent = happy ? 'Purr… one happy cat! Click or tap again to switch back.' : 'A quiet little cat.';
      playHappyCatAudio(happy);
    });
  </script>
</body>
</html>
