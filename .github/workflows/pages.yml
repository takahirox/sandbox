name: Deploy playground to Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sandbox-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: workers/persistent-counter/package-lock.json
      - name: Install Worker tools
        working-directory: workers/persistent-counter
        run: npm ci
      - name: Test Worker, persistence, CORS, and provisioning
        working-directory: workers/persistent-counter
        run: npm test
      - name: Validate Worker configuration and bundle
        working-directory: workers/persistent-counter
        run: npm run build
      - name: Validate versioned D1 migrations with Wrangler
        working-directory: workers/persistent-counter
        run: |
          npm run migrate:local
          npm run migrate:local
      - name: Test site build
        run: python3 -m unittest discover -s tests -v
      - name: Build site
        run: python3 scripts/build_site.py
      - name: Install browser for integration checks
        working-directory: workers/persistent-counter
        run: npx playwright install --with-deps chromium
      - name: Test frontend against local Worker and D1
        working-directory: workers/persistent-counter
        run: npm run test:browser
      - name: Provision D1 and discover Worker URL
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        working-directory: workers/persistent-counter
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run provision
      - name: Apply production migrations and deploy Worker
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        working-directory: workers/persistent-counter
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run deploy
      - name: Build site with deployed API URL
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: python3 scripts/build_site.py
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site
          include-hidden-files: true

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v5
